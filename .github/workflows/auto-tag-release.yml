name: Auto-tag & release on merge to main

# When code lands on main (PR merged or direct push), this workflow bumps the
# patch version in app/build.gradle.kts, commits it, creates a new signed tag
# (v1.0.1, v1.0.2, ...) and pushes it. The tag push triggers build-release.yml
# which compiles the APKs and publishes a GitHub Release automatically.

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (major/minor/patch)'
        required: false
        default: 'patch'

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.author.username != 'github-actions[bot]')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Determine next version
        id: bump
        run: |
          set -e
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LATEST_TAG" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
          fi
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *) PATCH=$((PATCH+1)) ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          NEW_CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          echo "Previous tag: ${LATEST_TAG:-none}"
          echo "New tag: $NEW_TAG (versionCode $NEW_CODE)"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "new_name=$NEW_TAG" >> "$GITHUB_OUTPUT"

          # Write versions into app/build.gradle.kts (idempotent)
          sed -i -E "s/versionCode = [0-9]+/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[0-9]+\.[0-9]+\.[0-9]+\"/versionName = \"${NEW_TAG#v}\"/" app/build.gradle.kts

          echo "--- updated app/build.gradle.kts ---"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Build debug APK with new version
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "StonicAI-${{ steps.bump.outputs.new_tag }}.apk"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump to ${{ steps.bump.outputs.new_tag }} [skip ci]"
            git push
          fi

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.bump.outputs.new_tag }}" \
            -m "Release ${{ steps.bump.outputs.new_tag }} (auto-generated)"
          git push origin "${{ steps.bump.outputs.new_tag }}"
